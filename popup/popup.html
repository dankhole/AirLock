<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Airlock</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Airlock</h1>
      <label class="toggle">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </header>

    <section class="delay-section">
      <label for="delay-input" title="Controls both site-entry waits and the hold required to weaken restrictions">Hover wait</label>
      <div class="delay-input-group">
        <input type="number" id="delay-input" min="1" max="600" value="1">
        <span class="delay-unit">minutes</span>
      </div>
    </section>

    <section class="delay-section">
      <label for="reset-input">Reset after</label>
      <div class="delay-input-group">
        <input type="number" id="reset-input" min="1" max="8760" value="24">
        <span class="delay-unit">hours</span>
      </div>
    </section>

    <section class="cooldown-section" aria-labelledby="cooldown-title">
      <div class="cooldown-copy">
        <h2 id="cooldown-title">Cooldown</h2>
        <p id="cooldown-status" aria-live="polite">Block all tracked sites for one hour</p>
      </div>
      <button type="button" id="cooldown-btn" class="cooldown-btn">Start 1 hour</button>
    </section>

    <section class="daily-lock-section" aria-labelledby="daily-lock-title">
      <div class="daily-lock-header">
        <div>
          <h2 id="daily-lock-title">Daily lock</h2>
          <p>Block tracked sites during this window</p>
        </div>
        <label class="toggle">
          <input type="checkbox" id="daily-lock-toggle" aria-label="Enable daily lock">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="daily-lock-times">
        <label for="daily-lock-start">
          <span>From</span>
          <input type="time" id="daily-lock-start" value="22:00" required>
        </label>
        <span class="daily-lock-arrow" aria-hidden="true">&rarr;</span>
        <label for="daily-lock-end">
          <span>Until</span>
          <input type="time" id="daily-lock-end" value="07:00" required>
        </label>
      </div>
      <p id="daily-lock-status" class="daily-lock-status" aria-live="polite">Off</p>
    </section>

    <section id="pending-config-section" class="pending-config-section" hidden>
      <div class="pending-config-copy">
        <span id="pending-config-title" class="pending-config-title">Updating settings</span>
        <strong id="pending-config-timer" class="pending-config-timer">0:00</strong>
      </div>
      <div class="pending-config-actions">
        <div
          id="pending-config-hover-target"
          class="pending-config-hover-target"
          title="Hover to count down"
          aria-label="Hover to count down"
        >
          <span></span>
        </div>
        <button type="button" id="pending-config-cancel" class="pending-config-cancel">Cancel</button>
      </div>
    </section>

    <section class="sites-section">
      <h2>Tracked Sites</h2>
      <p class="sites-help">Set a daily limit, then choose a hard block or cooldown</p>
      <button id="add-current-btn" class="add-current-btn" style="display: none"></button>
      <ul id="site-list" class="site-list"></ul>
      <form id="add-site-form" class="add-site-form">
        <input type="text" id="site-input" placeholder="example.com" autocomplete="off">
        <button type="submit" id="add-site-btn">+</button>
      </form>
    </section>
  </div>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title">
    <form method="dialog">
      <h2 id="confirm-dialog-title">Confirm change</h2>
      <p id="confirm-dialog-message"></p>
      <div class="confirm-dialog-actions">
        <button type="submit" value="cancel" class="confirm-dialog-cancel">Cancel</button>
        <button type="submit" value="confirm" id="confirm-dialog-submit" class="confirm-dialog-submit">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="../shared/daily-lock.js"></script>
  <script src="popup.js"></script>
</body>
</html>
